server {
    listen 80;
    server_name webchat.bitlesu.com;
    access_log /www/sites/webchat.bitlesu.com/log/access.log main;
    error_log  /www/sites/webchat.bitlesu.com/log/error.log;

    root /www/sites/webchat.bitlesu.com/index;
    index index.html;
    client_max_body_size 200m;
    # 大文件慢速上传（移动网络）需要更宽松的请求体读/写超时，默认 60s 偏紧
    client_body_timeout 300s;
    send_timeout 300s;

    location ^~ /.well-known/acme-challenge { allow all; root /usr/share/nginx/html; }

    # WebSocket → Workerman（宿主 127.0.0.1:2346）
    location ^~ /ws {
        proxy_pass http://127.0.0.1:2346;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # 后端 API → ThinkPHP（rewrite 携带 s 参数，保证 pathinfo 正确解析）
    location ^~ /api {
        rewrite ^/(.*)$ /index.php?s=/$1 last;
    }
    location ^~ /storage {
        rewrite ^/(.*)$ /index.php?s=/$1 last;
    }

    # ThinkPHP 单一入口 → php-fpm 容器
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9017;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_read_timeout 600s;
        fastcgi_buffering off;
    }

    # 前端 SPA：静态优先，其余回落 index.html（支持 history 路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 永不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # 带内容指纹的静态资源长期缓存（文件名变了才重新拉取）
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- HTTPS ----
    listen 443 ssl;
    http2 on;
    if ($scheme = http) { return 301 https://$host$request_uri; }
    ssl_certificate     /www/sites/webchat.bitlesu.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/webchat.bitlesu.com/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m; ssl_session_timeout 10m;
    error_page 497 https://$host$request_uri;
    add_header Strict-Transport-Security "max-age=31536000";
}
